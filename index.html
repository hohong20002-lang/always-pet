<title>올웨이즈 펫 쇼핑몰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 반응형 쇼핑몰. 상단 헤더 + 해시 라우팅 화면 + 모바일 하단 탭. 'UX 개선 포인트' 토글로 설계 의도 주석 노출 */
:root{
  --bg:#FBF9F1; --surface:#FFFFFF; --sunk:#F2EFE2; --line:#E2DECD;
  --fg:#1E2A20; --muted:#5E6A5F; --brand:#3D6B45; --brand-deep:#24432B; --on-brand:#FFFFFF;
  --brand-soft:#E5EEDF; --warm:#C9772E; --warm-soft:#F8E9D8;
  --ux:#6B4FA0; --ux-soft:#EFE9F8; --danger:#A8432F;
  --f-display:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px; --maxw:1120px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121813; --surface:#1A221B; --sunk:#222C23; --line:#334034;
  --fg:#ECE9DC; --muted:#A3AE9F; --brand:#8CC497; --brand-deep:#B9DDBE; --on-brand:#10200F;
  --brand-soft:#243626; --warm:#E3A066; --warm-soft:#3A2A1B;
  --ux:#BFA6EA; --ux-soft:#2B2338; --danger:#E58C78; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121813; --surface:#1A221B; --sunk:#222C23; --line:#334034;
  --fg:#ECE9DC; --muted:#A3AE9F; --brand:#8CC497; --brand-deep:#B9DDBE; --on-brand:#10200F;
  --brand-soft:#243626; --warm:#E3A066; --warm-soft:#3A2A1B;
  --ux:#BFA6EA; --ux-soft:#2B2338; --danger:#E58C78; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.logo b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--brand-deep)}
.gnb{display:flex;gap:4px;margin-left:8px}
.gnb a{text-decoration:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.gnb a[aria-current="page"]{color:var(--brand-deep);background:var(--brand-soft)}
.top .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.ux-toggle{border:1px solid var(--ux);background:transparent;color:var(--ux);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.ux-toggle[aria-pressed="true"]{background:var(--ux);color:var(--surface)}
.cart-btn{position:relative;text-decoration:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-weight:500}
.cart-btn .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:12px;margin-left:4px;padding:0 5px}

/* bottom tab (mobile) */
nav.tab{display:none}
@media (max-width:760px){
  .gnb,.cart-btn{display:none}
  nav.tab{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  nav.tab a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;text-decoration:none;font-size:12px;color:var(--muted)}
  nav.tab a svg{width:22px;height:22px}
  nav.tab a[aria-current="page"]{color:var(--brand-deep);font-weight:700}
  nav.tab a{position:relative}
  nav.tab [data-cartcnt]{position:absolute;top:3px;left:calc(50% + 6px);background:var(--brand);color:var(--on-brand);font-size:10px;line-height:16px;min-width:16px;text-align:center;border-radius:8px;padding:0 4px}
  main{padding-bottom:84px}
  .logo b{font-size:18px}
}

main{min-height:70vh}
section.view{padding-block:28px 56px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--brand);font-weight:700}
.lead{color:var(--muted);max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none;background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent;color:var(--brand-deep);border:1.5px solid var(--brand)}
.btn.quiet{background:var(--sunk);color:var(--fg)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.green{background:var(--brand-soft);color:var(--brand-deep)}
.tag.warm{background:var(--warm-soft);color:var(--warm)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.price{font-weight:700;font-size:18px}
.disclaim{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}

/* UX annotations */
.uxn{display:none}
body.ux-on .uxn{display:block;border:1.5px dashed var(--ux);background:var(--ux-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55;margin-block:10px}
body.ux-on .uxn b{color:var(--ux)}
.uxn .k{display:inline-block;font-weight:700;color:var(--ux);margin-right:6px}

/* home */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(30px,4.6vw,48px);color:var(--brand-deep)}
.hero .ph{border-radius:20px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.hero .ph img{width:100%;height:100%;object-fit:cover;display:block}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.concern{margin-top:44px}
.concern h2{font-size:24px}
.concern .row{margin-top:14px}
.band{margin-top:48px;display:grid;grid-template-columns:1fr 1.1fr;background:var(--brand-deep);color:var(--bg);border-radius:20px;overflow:hidden}
.band img{width:100%;height:100%;object-fit:cover;display:block;min-height:260px}
.band .txt{padding:32px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.band h2{font-size:28px;color:var(--bg)}
.band .lead{color:var(--bg);opacity:.85}
.band .btn{background:var(--bg);color:var(--brand-deep);align-self:flex-start}
.band ul{margin:0;padding-left:18px;opacity:.92}
.flow{margin-top:48px}
.flow ol{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s}
.flow li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.flow li::before{content:"0" counter(s);font-weight:700;color:var(--brand);font-size:13px}
.flow li b{display:block;margin:4px 0}
.flow li span{color:var(--muted);font-size:14px}
.split{margin-top:48px;display:grid;grid-template-columns:.8fr 1.2fr;gap:28px;align-items:center}
.split .ph{border-radius:20px;overflow:hidden;aspect-ratio:3/4;max-height:460px;max-width:100%}
.split .ph img{width:100%;height:100%;object-fit:cover;object-position:center 60%;display:block}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:13px}

/* shop */
.shop-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.filters{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.card .im{aspect-ratio:1/1;background:var(--sunk)}
.card .im img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .nm{font-weight:700}
.card .why{font-size:13px;color:var(--brand-deep);background:var(--brand-soft);border-radius:8px;padding:6px 8px}
.card .pr{margin-top:auto}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* detail */
.detail{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.detail .gal{border-radius:20px;overflow:hidden;aspect-ratio:1/1;background:var(--sunk);max-width:100%}
.detail .gal img{width:100%;height:100%;object-fit:cover;display:block}
.detail .info{display:flex;flex-direction:column;gap:16px;min-width:0}
.detail h1{font-size:30px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:10px 8px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);font-weight:700}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.qty button{border:0;background:transparent;width:36px;height:36px;font-size:18px}
.qty span{min-width:28px;text-align:center}
.check{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:14px}
.check.ok{background:var(--brand-soft);color:var(--brand-deep)}
.check.warn{background:var(--warm-soft);color:var(--warm)}
.back{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none;font-size:14px}

/* box builder */
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--brand)}
.q{display:flex;flex-direction:column;gap:10px}
.q label.t{font-weight:700}
.compo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.compo li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.compo li .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);margin-top:7px;grid-row:span 2}
.compo li small{color:var(--muted);font-size:13px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);text-align:left}
.plan[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.plan b{display:block}
.terms{font-size:14px;display:grid;gap:6px;margin:0;padding:0;list-style:none}
.terms li::before{content:"✓ ";color:var(--brand);font-weight:700}

/* cart */
.cart{display:grid;grid-template-columns:1.4fr .9fr;gap:24px;align-items:start}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.line .meta{min-width:0}
.line .meta small{color:var(--muted);display:block}
.sum{display:flex;flex-direction:column;gap:10px;position:sticky;top:84px}
.sum .r{display:flex;justify-content:space-between}
.sum .tot{font-size:20px;font-weight:700;border-top:1px solid var(--line);padding-top:10px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}

/* record */
.rec{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:start}
.petbar{display:flex;align-items:center;gap:14px}
.petbar .av{width:56px;height:56px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--brand-deep)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px}
.opts button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:700;font-size:14px}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);resize:vertical}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 49px,var(--line) 49px 50px)}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar i{display:block;border-radius:6px 6px 0 0;background:var(--brand);opacity:.8}
.bar.low i{background:var(--warm)}
.bar.today i{opacity:1;outline:2px solid var(--brand-deep);outline-offset:1px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ai{border-left:3px solid var(--brand);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.ai ul{margin:0;padding-left:18px}
.report{white-space:pre-wrap;font-size:14px;background:var(--sunk);border-radius:10px;padding:14px;margin:0;font-family:var(--f-body)}
.log{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.log li{display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.log li span:last-child{color:var(--muted);text-align:right}

/* my */
.my{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
.subhead{display:flex;gap:16px;align-items:center}
.subhead img{width:88px;height:88px;border-radius:12px;object-fit:cover}
.big{font-size:26px;font-family:var(--f-display);color:var(--brand-deep)}
input[type=range]{width:100%;accent-color:var(--brand)}
.endopts{display:grid;gap:10px}
.endopt{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);text-align:left}
.endopt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.endopt b{display:block}
.endopt small{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--brand-deep);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;z-index:40;max-width:calc(100% - 32px)}
.stack{display:flex;flex-direction:column;gap:14px}
.h2{font-size:22px}

@media (max-width:860px){
  .hero,.band,.split,.detail,.cart,.rec,.my{grid-template-columns:1fr}
  .flow ol{grid-template-columns:1fr 1fr}
  .split .ph{aspect-ratio:4/3}
  .sum{position:static}
}
@media (max-width:420px){.plans{grid-template-columns:1fr}.flow ol{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#home"><img src="img/logo.jpg" alt=""><b>Always Pet</b></a>
    <nav class="gnb" aria-label="주요 메뉴">
      <a href="#shop" data-nav="shop">쇼핑</a>
      <a href="#box" data-nav="box">케어 박스</a>
      <a href="#record" data-nav="record">건강 기록</a>
      <a href="#my" data-nav="my">구독 관리</a>
    </nav>
    <div class="tools">
      <button class="ux-toggle" id="uxToggle" aria-pressed="false" title="화면마다 과제1 고객 불편을 어떻게 해결했는지 보여줍니다">UX 개선 포인트</button>
      <a class="cart-btn" href="#cart" data-nav="cart">장바구니<span class="cnt num" data-cartcnt>0</span></a>
    </div>
  </div>
</header>

<main id="app" class="wrap"></main>

<nav class="tab" aria-label="하단 메뉴">
  <a href="#home" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>홈</a>
  <a href="#shop" data-nav="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1 12H6zM9 8a3 3 0 016 0"/></svg>쇼핑</a>
  <a href="#record" data-nav="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg>기록</a>
  <a href="#my" data-nav="my"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18M8 3v4M16 3v4"/></svg>구독</a>
  <a href="#cart" data-nav="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.5 12h12L22 7H6.2"/></svg>장바구니<span class="num" data-cartcnt>0</span></a>
</nav>

<div class="toast" id="toast" hidden></div>

  {id:"slip", label:"집에서 자주 미끄러져요", short:"생활환경"}
];

   desc:"아이의 나이·체중·관심사에 맞춰 간식, 영양 보조 제품, 케어 안내서를 매달 구성해 보내드려요.",
   concerns:["joint","appetite","digest","skin"], main:[], why:{joint:"관절 케어 구성 선택 가능",appetite:"기호성 높은 소포장 간식 포함",digest:"소화가 편한 간식으로 구성",skin:"저자극 위생용품 포함 (프리미엄)"}},

var MEAL_LABEL=["거의 안 먹음","절반","잘 먹음"];
function weekData(){
  var saved=S.logs.length&&S.logs[S.logs.length-1].d==="11/11";
  var d=S.logs.slice(saved?-7:-6).map(function(l){return {d:l.d, meal:l.meal};});
  if(saved){ d[d.length-1].d="오늘"; d[d.length-1].today=true; }
  else d.push({d:"오늘", meal:S.today.meal, today:true});
  return d;
}
function aiSummary(){
  var logs=S.logs.concat(S.today.meal!==null?[{meal:S.today.meal,walk:S.today.walk||"",poop:S.today.poop||""}]:[]);
  var first=logs.slice(0,3), last=logs.slice(-3);
  var avg=function(a){return a.reduce(function(s,x){return s+x.meal;},0)/a.length;};
  var pts=[];
  if(avg(last)<avg(first)) pts.push("식사량이 주 초반보다 줄었어요. 최근 3일 중 "+last.filter(function(x){return x.meal<2;}).length+"일은 절반 이하로 먹었어요.");
  var lowWalk=logs.filter(function(x){return /줄었음/.test(x.walk||"");}).length;
  if(lowWalk) pts.push("산책·활동이 평소보다 줄었다고 기록한 날이 "+lowWalk+"일이에요.");
  var memos=S.logs.filter(function(l){return l.memo;}).map(function(l){return l.d+" '"+l.memo+"'";});
  if(memos.length) pts.push("메모: "+memos.join(", "));
  var ask=[];
  if(S.today.water===null) ask.push("물 마시는 양은 평소와 비슷했나요?");
  if(!S.logs.some(function(l){return /계단|다리|절뚝/.test(l.memo);})) ask.push("걸을 때 특정 다리를 아껴 쓰는 모습이 있었나요?"); else ask.push("계단 앞에서 멈춘 건 처음인가요, 전에도 있었나요?");
  return {pts:pts, ask:ask};
}

      '<h1 class="h2">'+(s.endChoice==="farewell"?"마음을 다해 정리했어요":"처리가 끝났어요")+'</h1><p>'+esc(msg)+'</p>'+
      ux("⑧ 배려 있는 종료","해지를 막는 단계(리텐션 팝업, 쿠폰 공세)를 두지 않았어요. 이별한 보호자에게 광고·기록 알림이 계속 가지 않게 하는 것이 과제1의 <b>'이별 후 알림을 줄이는 종료 모드'</b>예요.")+
      '<button class="btn quiet" data-restore>프로토타입 되돌리기</button></div></section>';
  }
  var suggest = s.remain>=50? 7 : (s.remain<=20? -5 : 0);
  var endUI="";
  if(s.endChoice!==null){
    endUI='<div class="panel stack"><h2 class="h2" style="font-size:19px">구독을 어떻게 할까요?</h2><div class="endopts">'+
      [["pause","잠시 쉬기","1개월 동안 배송과 결제를 멈춰요. 기록은 그대로 쓸 수 있어요."],
       ["cancel","해지하기","다음 결제부터 멈춰요. 위약금은 없어요."],
       ["farewell","아이와 이별했어요","남은 회차를 환불하고 모든 알림·광고를 멈춰요. 다시 묻지 않을게요."]].map(function(o){
        return '<button class="endopt" data-end="'+o[0]+'" aria-pressed="'+(s.endChoice===o[0])+'"><b>'+o[1]+'</b><small>'+o[2]+'</small></button>';}).join("")+
      '</div>'+
      (s.endChoice?'<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-endconfirm>'+({pause:"1개월 쉬기",cancel:"해지 확정",farewell:"정리하기"}[s.endChoice])+'</button><button class="btn quiet" data-endcancel>돌아가기</button></div>':'<button class="btn quiet" data-endcancel>돌아가기</button>')+
      '</div>';
  }
  return '<section class="view"><h1 class="h2" style="font-size:28px;margin-bottom:16px">구독 관리</h1><div class="my">'+
    '<div class="stack">'+
      '<div class="panel stack">'+
        '<div class="subhead"><img src="img/box.jpg" alt=""><div><span class="tag green">이용 중</span><h2 class="h2" style="font-size:19px;margin-top:4px">시니어 맞춤 케어 박스 · '+(s.plan==="premium"?"프리미엄":"기본")+'</h2><span class="num" style="color:var(--muted)">'+(s.plan==="premium"?"월 39,900원":"월 29,900원")+' · '+s.cycleWeeks+'주마다</span></div></div>'+
        '<div><span style="color:var(--muted);font-size:14px">다음 배송</span><div class="big num">'+fmt(s.next)+'</div></div>'+
        '<div class="row"><button class="btn small quiet" data-shift="-7">1주 당기기</button><button class="btn small quiet" data-shift="7">1주 미루기</button><button class="btn small quiet" data-shift="28">이번 회차 건너뛰기</button></div>'+
      '</div>'+
      '<div class="panel stack">'+
        '<h2 class="h2" style="font-size:19px">지난 박스, 얼마나 남았나요?</h2>'+
        '<label for="remain" style="font-size:14px;color:var(--muted)">간식·영양 보조 제품 기준 <b class="num" style="color:var(--fg)">'+s.remain+'%</b> 남음</label>'+
        '<input id="remain" type="range" min="0" max="100" step="10" value="'+s.remain+'">'+
        (suggest? '<div class="check '+(suggest>0?"ok":"warn")+'">'+(suggest>0?"↻":"!")+' <span>지금 속도라면 '+(suggest>0?"<b>1주 미뤄도</b> 충분해요.":"<b>5일 앞당기는 게</b> 좋겠어요.")+' 다음 배송을 '+fmt(addDays(s.next,suggest))+'로 바꿀까요?</span></div><button class="btn small" data-shift="'+suggest+'">'+fmt(addDays(s.next,suggest))+'로 변경</button>':'<div class="check ok">✓ <span>지금 배송일이 남은 양과 잘 맞아요.</span></div>')+
        ux("⑨ 잔여량 기반 배송","정해진 날짜에 무조건 보내지 않고 <b>남은 양</b>을 기준으로 배송일을 제안해요. 과제1의 '배송을 소비 속도에 맞춘다'를 구현한 화면이에요.")+
      '</div>'+
    '</div>'+
    '<div class="stack">'+
      '<div class="panel stack"><h2 class="h2" style="font-size:19px">이번 달 구성</h2><ul class="compo">'+boxCompo().map(function(c){return '<li><span class="dot"></span><b>'+esc(c.n)+'</b><small>'+c.r+'</small></li>';}).join("")+'</ul>'+
        '<a class="btn small ghost" href="#box" data-rebuild>구성 다시 고르기</a></div>'+
      (s.endChoice===null?'<div class="panel stack"><h2 class="h2" style="font-size:17px">구독 멈추기</h2><p style="color:var(--muted);font-size:14px">잠시 쉬기, 해지, 이별 모두 여기서 2번 탭이면 끝나요.</p><button class="btn small quiet" data-endopen>구독 멈추기·해지</button></div>':endUI)+
    '</div>'+
  '</div></section>';
};

/* ---------- 라우터 ---------- */
var app=document.getElementById("app");
function route(){
  var h=(location.hash||"#home").slice(1);
  var key=h, html;
  if(h.indexOf("p-")===0){ html=V.product(h.slice(2)); key="shop"; }
  else if(V[h]){ html=V[h](); }
  else { html=V.home(); key="home"; }
  app.innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(function(a){ if(a.getAttribute("data-nav")===key) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  syncCount();
}
function rerender(){ var y=window.scrollY; route(); window.scrollTo(0,y); }
window.addEventListener("hashchange", function(){ if(location.hash!=="#cart") S.ordered=null; route(); window.scrollTo(0,0); });

/* ---------- 이벤트 ---------- */
document.addEventListener("click", function(e){
  var t=e.target.closest("button"); if(!t) return;
  var d=t.dataset;
  if(t.id==="uxToggle"){ var on=document.body.classList.toggle("ux-on"); t.setAttribute("aria-pressed",on); persist(); toast(on?"UX 개선 포인트를 표시해요":"UX 개선 포인트를 숨겼어요"); return; }
  if(d.goConcern){ S.filter={concern:d.goConcern,cat:"all"}; location.hash="shop"; return; }
  if(d.concern){ S.filter.concern = S.filter.concern===d.concern?null:d.concern; rerender(); return; }
  if(d.cat){ S.filter.cat=d.cat; rerender(); return; }
  // product
  if(d.mode){ V.product.st.mode=d.mode; rerender(); return; }
  if(d.cycle){ V.product.st.cycle=+d.cycle; rerender(); return; }
  if(d.q){ var st=V.product.st; st.qty=Math.max(1,Math.min(9,st.qty+(+d.q))); rerender(); return; }
  if(d.add!==undefined){ var s2=V.product.st, p=byId(s2.id);
    var price = s2.mode==="trial"? p.trial : (s2.mode==="sub"? Math.round(p.price*0.9/100)*100 : p.price);
    var note = s2.mode==="trial"?"소량 체험팩 (3회분)":(s2.mode==="sub"?"정기배송 · "+s2.cycle+"주마다":"한 번 구매");
    addCart({key:p.id+"|"+s2.mode+"|"+s2.cycle, id:p.id, name:p.name, img:p.img, price:price, qty:s2.qty, mode:s2.mode==="sub"?"sub":"once", note:note}); return; }
  // box
  if(d.pet){ S.pet[d.pet]=d.v; rerender(); return; }
  if(d.concernPick){ var c=S.pet.concerns, i=c.indexOf(d.concernPick);
    if(i>-1) c.splice(i,1); else { if(c.length>=2){ toast("최대 2개까지 고를 수 있어요"); return; } c.push(d.concernPick); }
    rerender(); return; }
  if(d.current){ var md=document.getElementById("meds"); if(md) S.pet.meds=md.value; var cu=S.pet.current, j=cu.indexOf(d.current); if(j>-1) cu.splice(j,1); else cu.push(d.current); rerender(); return; }
  if(d.step){ var m=document.getElementById("meds"); if(m) S.pet.meds=m.value;
    if(+d.step>0 && S.box.step===1 && !S.pet.concerns.length){ toast("변화를 하나 이상 골라 주세요"); return; }
    S.box.step=Math.max(0,Math.min(3,S.box.step+(+d.step))); rerender(); return; }
  if(d.plan){ S.box.plan=d.plan; rerender(); return; }
  if(d.addbox!==undefined){ var pr=S.box.plan==="premium"?39900:29900;
    S.sub.plan=S.box.plan;
    addCart({key:"carebox|"+S.box.plan, id:"carebox", name:"시니어 맞춤 케어 박스 · "+(S.box.plan==="premium"?"프리미엄":"기본"), img:"box.jpg", price:pr, qty:1, mode:"sub", note:"매달 정기배송 · "+boxCompo().length+"가지 구성"}); return; }
  // cart
  if(d.cq){ var it=S.cart[+d.cq]; it.qty=Math.max(1,it.qty+(+d.d)); persist(); rerender(); return; }
  if(d.rm){ S.cart.splice(+d.rm,1); persist(); rerender(); return; }
  if(d.order!==undefined){ var sum=S.cart.reduce(function(a,c){return a+c.price*c.qty;},0);
    S.ordered={no:"AP-1111-"+String(Math.floor(Math.random()*9000)+1000), total:sum+(sum>=30000?0:3000), hasSub:S.cart.some(function(c){return c.mode==="sub";})};
    S.cart=[]; persist(); rerender(); return; }
  // record
  if(d.today){ var k=d.today, v=k==="meal"?+d.v:d.v; var mm=document.getElementById("memo"); if(mm) S.today.memo=mm.value;
    S.today[k]= S.today[k]===v?null:v; rerender(); return; }
  if(d.save!==undefined){ var mo=document.getElementById("memo"); var tt=S.today;
    S.logs.push({d:"11/11", meal:tt.meal, walk:tt.walk, poop:tt.poop, memo:(mo?mo.value:tt.memo).trim()});
    S.today={meal:null,walk:null,poop:null,water:tt.water,memo:""};
    S.logs = S.logs.slice(-7);
    rerender(); toast("오늘 기록을 저장했어요"); return; }
  if(d.report!==undefined){ S.reportOpen=!S.reportOpen; rerender(); return; }
  if(d.copy!==undefined){ var txt=document.getElementById("reportText").textContent;
    var fallback=function(){var r=document.createRange();r.selectNodeContents(document.getElementById("reportText"));var sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("리포트를 선택했어요. 복사해 주세요");};
    try{ navigator.clipboard.writeText(txt).then(function(){toast("리포트를 복사했어요");},fallback); }catch(err){ fallback(); }
    return; }
  // my
  if(d.shift){ S.sub.next=addDays(S.sub.next,+d.shift); if(+d.shift!==28&&Math.abs(+d.shift)<7) S.sub.remain=40; rerender(); toast("다음 배송일을 "+fmt(S.sub.next)+"로 바꿨어요"); return; }
  if(d.endopen!==undefined){ S.sub.endChoice=""; rerender(); return; }
  if(d.end){ S.sub.endChoice=d.end; rerender(); return; }
  if(d.endcancel!==undefined){ S.sub.endChoice=null; rerender(); return; }
  if(d.endconfirm!==undefined){ S.sub.ended = S.sub.endChoice==="pause"? fmt(addDays(S.sub.next,30)) : "done"; rerender(); window.scrollTo(0,0); return; }
  if(d.restore!==undefined){ S.sub.ended=null; S.sub.endChoice=null; rerender(); return; }
});
document.addEventListener("input", function(e){
  if(e.target.id==="remain"){ S.sub.remain=+e.target.value; var y=window.scrollY; route(); window.scrollTo(0,y); var r=document.getElementById("remain"); if(r) r.focus(); }
});
document.addEventListener("click", function(e){ var a=e.target.closest("[data-rebuild]"); if(a){ S.box.step=3; } });

if(document.body.classList.contains("ux-on")) document.getElementById("uxToggle").setAttribute("aria-pressed","true");
route();
})();
</script>
